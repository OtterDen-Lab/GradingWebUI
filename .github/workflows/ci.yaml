name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run dependency audit (report-only)
        # Keep security findings visible in the workflow without preventing a
        # release. Triage findings for reachability and record any accepted
        # risk before deciding whether to update or add a scoped exception.
        continue-on-error: true
        run: |
          # These toolchain advisories are tracked separately.
          uv run pip-audit \
            --skip-editable \
            --ignore-vuln GHSA-6vgw-5pg2-w6jp \
            --ignore-vuln GHSA-8rrh-rw8j-w5fx

services:
  web:
    build:
      context: ../../
      dockerfile: docker/web-grading/Dockerfile
    image: autograder-web-grading:latest
    container_name: autograder-web-grading
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - GRADING_DB_PATH=/data/grading.db
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - QUIZGEN_ALLOW_GENERATOR=${QUIZGEN_ALLOW_GENERATOR:-1}
    volumes:
      - grading-data:/data
      - ../../src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8765/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  grading-data:
    driver: local
